name: Fetch Guess the Player legends data

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Library slugs to (re)fetch, space separated (blank = every entry not fetched yet)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: |
          set -o pipefail
          if ! python3 legends.py fetch ${{ inputs.slugs }} 2>&1 | tee run.log; then
            echo "::error title=legends failed::$(tail -c 3000 run.log | tr '\n' '|')"; exit 1; fi
          echo "::notice title=legends::$(tail -c 3000 run.log | tr '\n' '|')"
      - name: Commit and push
        run: |
          git config user.name "fromwaydowntown-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/legends
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Legends data"
          git pull --rebase -q && git push
